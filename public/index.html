<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Welcome to Firebase Hosting</title>
    <link rel="stylesheet" href="style.css">

    <!-- update the version number as needed -->
    <script defer src="/__/firebase/10.7.1/firebase-app-compat.js"></script>
    <!-- include only the Firebase features as you need -->
    <script defer src="/__/firebase/10.7.1/firebase-auth-compat.js"></script>
    <script defer src="/__/firebase/10.7.1/firebase-database-compat.js"></script>
    <script defer src="/__/firebase/10.7.1/firebase-firestore-compat.js"></script>
    <script defer src="/__/firebase/10.7.1/firebase-functions-compat.js"></script>
    <script defer src="/__/firebase/10.7.1/firebase-messaging-compat.js"></script>
    <script defer src="/__/firebase/10.7.1/firebase-storage-compat.js"></script>
    <script defer src="/__/firebase/10.7.1/firebase-analytics-compat.js"></script>
    <script defer src="/__/firebase/10.7.1/firebase-remote-config-compat.js"></script>
    <script defer src="/__/firebase/10.7.1/firebase-performance-compat.js"></script>
    <!-- 
      initialize the SDK after all desired features are loaded, set useEmulator to false
      to avoid connecting the SDK to running emulators.
    -->
    <script defer src="/__/firebase/init.js?useEmulator=true"></script>

    <script defer src="app.js"></script>
</head>

<body>
    <div id="game-container">
        <div id="scanlines"></div>
        <canvas id="gameCanvas" width="640" height="400"></canvas>

        <div id="message-overlay">
            <h1>DOOM JS</h1>
            <button class="btn" onclick="startGame()">ENTER HELL</button>
            <p style="margin-top:20px; font-size: 0.7rem; color: #888;">Controls: Arrows to Move/Turn, Space to Shoot
            </p>
        </div>

        <div id="hud">
            <div class="stat-box">
                <span class="stat-label">AMMO</span>
                <span class="stat-value" id="ammo-val">50</span>
            </div>
            <div class="stat-box" style="width: 15%;">
                <span class="stat-label">HEALTH</span>
                <span class="stat-value" id="health-val">100%</span>
            </div>
            <div id="doom-face">
                <!-- Face will be drawn by JS or placeholder -->
                <div
                    style="width: 100%; height: 100%; background: #885544; display: flex; justify-content: center; align-items: center;">
                    <div style="width: 8px; height: 8px; background: black; margin: 2px;"></div>
                    <div style="width: 8px; height: 8px; background: black; margin: 2px;"></div>
                </div>
            </div>
            <div class="stat-box" style="width: 15%;">
                <span class="stat-label">ARMOR</span>
                <span class="stat-value" id="armor-val">0%</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">WEAPON</span>
                <span class="stat-value">PISTOL</span>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>

</html>
