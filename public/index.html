<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로 러닝 페이스 계산기 | Pro Running Calculator</title>
    <meta name="description" content="러너를 위한 최고의 페이스 계산기. 마라톤, 하프, 10k, 5k 목표 설정 및 구간별 기록 분석.">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Pretendard:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <script defer src="app.js"></script>
</head>

<body>
    <div class="background-mesh"></div>

    <main class="container">
        <header class="app-header">
            <div class="logo">PROPACE</div>
            <h1>러닝 페이스 계산기</h1>
            <p>목표를 설정하고 한계를 뛰어넘으세요.</p>
        </header>

        <div class="calculator-card glass-panel">
            <div class="mode-tabs">
                <button class="tab-btn active" data-mode="pace" id="tab-pace">페이스 계산</button>
                <button class="tab-btn" data-mode="time" id="tab-time">예상 기록</button>
            </div>

            <div class="input-section">
                <!-- Distance Input Group -->
                <div class="input-group" id="group-distance">
                    <label>거리 (Distance)</label>
                    <div class="input-row">
                        <select id="distance-select" class="premium-select">
                            <option value="5">5km</option>
                            <option value="10">10km</option>
                            <option value="21.0975">하프 마라톤 (21.1k)</option>
                            <option value="42.195">풀 마라톤 (42.2k)</option>
                            <option value="custom">직접 입력</option>
                        </select>
                        <div class="custom-input-wrapper hidden" id="custom-distance-wrapper">
                            <input type="number" id="distance-custom" placeholder="0" step="0.01">
                            <span class="unit">km</span>
                        </div>
                    </div>
                </div>

                <!-- Time Input Group -->
                <div class="input-group" id="group-time">
                    <label>시간 (Time)</label>
                    <div class="time-inputs">
                        <div class="time-field">
                            <input type="number" id="time-hour" placeholder="0" min="0">
                            <span>hr</span>
                        </div>
                        <div class="time-field">
                            <input type="number" id="time-min" placeholder="0" min="0" max="59">
                            <span>min</span>
                        </div>
                        <div class="time-field">
                            <input type="number" id="time-sec" placeholder="0" min="0" max="59">
                            <span>sec</span>
                        </div>
                    </div>
                </div>

                <!-- Pace Input Group -->
                <div class="input-group hidden" id="group-pace">
                    <label>페이스 (Pace)</label>
                    <div class="time-inputs">
                        <div class="time-field">
                            <input type="number" id="pace-min" placeholder="0" min="0">
                            <span>min</span>
                        </div>
                        <div class="time-field">
                            <input type="number" id="pace-sec" placeholder="0" min="0" max="59">
                            <span>sec</span>
                        </div>
                        <span class="per-unit">/km</span>
                    </div>
                </div>
            </div>

            <div class="result-display" id="result-display">
                <div class="result-label" id="result-label">평균 페이스</div>
                <div class="result-value" id="result-value">--:--</div>
                <div class="result-unit" id="result-unit">/km</div>
            </div>

            <div class="action-buttons">
                <button class="action-btn secondary" id="reset-btn">초기화</button>
                <button class="action-btn primary" id="calc-btn">계산하기</button>
            </div>
        </div>

        <div class="splits-card glass-panel" id="splits-card">
            <div class="card-header">
                <h2>구간 기록표 (Splits)</h2>
                <div class="split-controls">
                    <button class="split-toggle active" data-gap="1">1km</button>
                    <button class="split-toggle" data-gap="5">5km</button>
                </div>
            </div>
            <div class="table-container">
                <table id="splits-table">
                    <thead>
                        <tr>
                            <th>거리</th>
                            <th>누적 시간</th>
                            <th>구간 페이스</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Generated by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer class="app-footer">
        <p>© 2026 ProPace Calculator. Designed for Runners.</p>
        <button id="feedback-open-btn" class="footer-link-btn">버그 제보 및 의견 보내기</button>
    </footer>

    <!-- Feedback Modal -->
    <div class="modal-overlay hidden" id="feedback-modal">
        <div class="modal-content glass-panel">
            <button class="modal-close" id="feedback-close-btn">&times;</button>
            <h2>의견 보내기</h2>
            <p class="modal-desc">버그 제보나 추가하고 싶은 기능이 있다면 알려주세요!</p>

            <form id="feedback-form" action="https://formspree.io/f/mzdejrqv" method="POST">
                <div class="input-group">
                    <label for="fb-email">이메일 (답변을 원하시면 입력해주세요)</label>
                    <input type="email" id="fb-email" name="email" placeholder="runner@example.com">
                </div>
                <div class="input-group">
                    <label for="fb-message">내용</label>
                    <textarea id="fb-message" name="message" rows="4" placeholder="자유롭게 의견을 적어주세요." required></textarea>
                </div>
                <div class="action-buttons">
                    <button type="submit" class="action-btn primary">보내기</button>
                </div>
                <p id="feedback-status" class="status-msg"></p>
            </form>
        </div>
    </div>
</body>

</html>
